[package]
name = "backwriter"
version = "0.3.0"
description = "Current structural text coordination Core, Runtime, and CLI"
license = "MIT"
repository = "https://github.com/NOEEZClisher/Backwriter"
readme = "README.md"
edition = "2024"
rust-version = "1.95"

[lib]
name = "backwriter"
path = "src/lib.rs"

[dependencies]
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"
serde = { version = "=1.0.228", default-features = false }
serde_json = "=1.0.150"
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "=2.0.19"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
